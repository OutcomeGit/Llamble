[package]
name = "llamble-helper"
version = "0.1.0"
edition = "2021"
description = "Small Windows helper for the Llamble app: lists open windows (for game detection) and graphics cards. Reads one command per line on stdin, answers one JSON line on stdout."
publish = false

# The only outside code is Microsoft's official Windows bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Graphics_Dxgi",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
