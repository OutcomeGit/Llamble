[package]
name = "llamble-helper"
version = "0.1.0"
edition = "2021"
description = "Small Windows helper for the Llamble app: lists open windows (for game detection) and graphics cards, captures one program's sound for screen sharing, and records the screen or a window to MP4 on the graphics card. Reads one command per line on stdin, answers one JSON line on stdout."
publish = false

# The only outside code is Microsoft's official Windows bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "implement",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Dxgi",
  "Win32_System_ProcessStatus",
  "Win32_UI_Input_KeyboardAndMouse",
  # native recording: screen/window capture, the graphics card, its video encoder, MP4 writing
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_Media_MediaFoundation",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
] }

# the COM helper macro (#[implement]) needs the core crate by name; same Microsoft crate family
windows-core = "0.58"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
