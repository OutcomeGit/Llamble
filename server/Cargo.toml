[package]
name = "llamble-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
argon2 = "0.5"
rand = "0.8"
ulid = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
scraper = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
url = "2"
dashmap = "6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = "1"
once_cell = "1"
percent-encoding = "2"
mime = "0.3"
rustls-acme = { version = "0.13", default-features = false, features = ["axum", "ring", "tls12"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio-tungstenite = "0.26"
tokio-yamux = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
rrule = "0.14.0"
