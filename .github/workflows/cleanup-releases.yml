# One-off cleanup (Nov 14): Llamble v0.1.270 and v0.1.271 were built while code that doesn't
# belong in this repo was in it. This deletes those two releases and their tags. Runs once
# when this file is pushed; safe to delete afterwards.
name: cleanup-releases
on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-releases.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete v0.1.270 and v0.1.271 and their tags
        run: |
          for t in v0.1.270 v0.1.271 v0.1.272; do
            gh release delete "$t" --repo "$REPO" --yes --cleanup-tag || echo "no release $t"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$t" 2>/dev/null || true
          done
